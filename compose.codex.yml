name: ashare-mcp

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ashare-mcp
    restart: unless-stopped
    mem_limit: 768m
    env_file:
      - .env
    environment:
      CACHE_DIR: /data
      LOG_LEVEL: INFO
    ports:
      - "127.0.0.1:18001:9876"
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

